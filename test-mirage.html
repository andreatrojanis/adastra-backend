<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRAGE — Test Fase 1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:monospace;background:#0d0d0d;color:#ddd;padding:24px;font-size:13px;line-height:1.5}
h1{color:#c9a84c;letter-spacing:.2em;font-size:13px;margin-bottom:4px}
p.sub{color:#666;font-size:11px;margin-bottom:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
button{padding:8px 16px;background:#c9a84c;color:#111;border:none;border-radius:6px;cursor:pointer;font-family:monospace;font-weight:bold;font-size:12px}
button.sec{background:#222;color:#c9a84c;border:1px solid #c9a84c}
button:disabled{opacity:.4;cursor:not-allowed}
.section{margin:18px 0 8px;color:#c9a84c;font-size:11px;letter-spacing:.15em;text-transform:uppercase;border-bottom:1px solid #222;padding-bottom:4px}
.box{background:#161616;border-radius:6px;padding:10px 12px;margin:6px 0}
.ok{border-left:3px solid #2e7d32}
.fail{border-left:3px solid #c62828;color:#ef9a9a}
.pending{border-left:3px solid #c9a84c;color:#c9a84c}
table{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px}
th,td{padding:4px 6px;text-align:center;border-bottom:1px solid #222}
th{color:#666;font-weight:normal}
td.l{text-align:left;color:#ccc}
.hot{color:#ef9a9a;font-weight:bold}
.gold{color:#c9a84c;font-weight:bold}
.dim{color:#666}
</style>
</head>
<body>
<h1>M I R A G E — TEST FASE 2.1</h1>
<p class="sub">Stessi 3 scenari di test.html · endpoint /api/analyze-mirage · non tocca la produzione</p>

<div class="btns">
  <button onclick="runAll()">MIRAGE · 3 SCENARI</button>
  <button onclick="runPhase2()">FASE 2 · TRE MODELLI (IDCM)</button>
  <button class="sec" onclick="runCompare()">CONFRONTO PRODUZIONE vs MIRAGE</button>
  <button class="sec" onclick="document.getElementById('out').innerHTML=''">CLEAR</button>
</div>
<div id="out"></div>

<script>
const EP_MIRAGE='https://adastra-backend-sigma.vercel.app/api/analyze-mirage';
const EP_PROD='https://adastra-backend-sigma.vercel.app/api/analyze';
const DIMS=['requisiti','innovazione','mercato','team','numeri','impatti'];
const NAMES=['A01 Formale','A02 Strategico','A03 Territoriale','A04 Devil'];
const OUT=document.getElementById('out');

/* Scenari identici a test.html */
const SCENARIOS=[
  {id:'s1',name:'SCENARIO 1 — Campi vuoti',d:'PROGETTO: — | SETTORE: — | INVESTIMENTO: 0 | TRL: 1 | LOI: 0 | TEAM: 0 anni | CAPITAL: 0 | DEMINIMIS: Non verificato'},
  {id:'s2',name:'SCENARIO 2 — Dati medi',d:'PROGETTO: TechFlow | SETTORE: SaaS B2B | REGIONE: Puglia | INVESTIMENTO: 500000 | TRL: 5 | LOI: 5 | TEAM: 8 anni | CAPITAL: 15000 | DEMINIMIS: verificato | FIDEIUSSIONE: da strutturare | BREAKEVEN: 18 mesi | IP: in corso'},
  {id:'s3',name:'SCENARIO 3 — STARTON completo',d:'PROGETTO: START ON piattaforma SaaS multi-agente AI per pre-valutazione finanziabilita startup PMI attraverso panel Claude GPT Grok con report strutturato score piano pre-candidatura semaforo mandato | SETTORE: SaaS B2B Fintech Finanza Agevolata | REGIONE: Puglia Lecce SUD | INVESTIMENTO: 900000 | TRL: 6 prototipo funzionante testato casi reali | LOI: 10 lettere intento firmate | TEAM: 15 anni esperienza cumulata IT finanza commerciale | CAPITAL: 30000 | DEMINIMIS: verificato | FIDEIUSSIONE: da strutturare | BREAKEVEN: 12 mesi | IP: algoritmo multi-agente deposito brevetto UIBM | COMPETITOR: non risultano piattaforme verticali comparabili | RISCHIO: lenta adozione dipendenza API AI evoluzione normativa | DIPENDENZE: Anthropic OpenAI xAI | IMPATTI: occupazione digitalizzazione inclusione genere | STARTUP: si | COMPAGINE: oltre 51% under36 donne | COINVESTITORI: in trattativa | REVENUE: 99 report 399 dossier 7% success fee'}
];

/* Prompt identici a test.html; withDims aggiunge SOLO il campo dimensioni */
function buildP(d,withDims){
  const J='Rispondi SOLO con JSON valido. Nessun testo prima o dopo. Nessun markdown.'+
    (withDims?' Il campo "dimensioni" contiene sei punteggi interi 0-100 (requisiti, innovazione, mercato, team, numeri, impatti) coerenti con la tua analisi.':'');
  const D=withDims?'"dimensioni":{"requisiti":70,"innovazione":70,"mercato":70,"team":70,"numeri":70,"impatti":70},':'';
  return [
    'Sei un istruttore formale Invitalia specializzato in compliance.\n'+d+'\n\n'+J+'\n{"scoreON":75,"scoreSS":80,'+D+'"sintesi":"analisi","puntiForza":["f1","f2"],"puntiDeboli":["d1"],"redFlags":["r1"]}',
    'Sei un analista strategico di startup. Valuta business case.\n'+d+'\n\n'+J+'\n{"scoreON":72,"scoreSS":78,'+D+'"sintesi":"analisi","puntiForza":["f1","f2"],"puntiDeboli":["d1","d2"]}',
    'Sei un esperto di sviluppo territoriale italiano.\n'+d+'\n\n'+J+'\n{"scoreON":65,"scoreSS":70,'+D+'"sintesi":"analisi","puntiForza":["f1"],"puntiDeboli":["d1"],"opportunita":["o1","o2"]}',
    'Sei un devil advocate severo. Trova criticita bloccanti.\n'+d+'\n\n'+J+'\n{"scoreON":55,"scoreSS":60,'+D+'"sintesi":"critiche","critiche":["c1","c2","c3"],"puntiForza":["f1"],"puntiDeboli":["d1"]}'
  ];
}

async function post(ep,prompts){
  const res=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ai:'claude',prompts})});
  const txt=await res.text();
  let data;try{data=JSON.parse(txt);}catch(e){throw new Error('HTTP '+res.status+' — '+txt.substring(0,150));}
  if(!data.results)throw new Error('nessun results — '+txt.substring(0,150));
  return data;
}

function section(t){const d=document.createElement('div');d.className='section';d.textContent=t;OUT.appendChild(d);}
function box(cls,html){const d=document.createElement('div');d.className='box '+cls;d.innerHTML=html;OUT.appendChild(d);return d;}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function mirageTable(m,results){
  let h='<table><tr><th>Agente</th><th>ON</th><th>SS</th>'+DIMS.map(d=>'<th>'+d.slice(0,5)+'</th>').join('')+'</tr>';
  results.forEach((r,i)=>{
    if(i>3)return;
    const v=(m.agent_vectors||[])[i];
    if(!v){h+='<tr><td class="l hot">'+NAMES[i]+'</td><td colspan="8" class="hot">non ha risposto — escluso</td></tr>';return;}
    h+='<tr><td class="l">'+NAMES[i]+'</td><td>'+r.scoreON+'</td><td>'+r.scoreSS+'</td>'+v.map(x=>'<td>'+Math.round(x*100)+'</td>').join('')+'</tr>';
  });
  if(m.idp_per_dim){
    h+='<tr><td class="l gold">IDP_i merito</td><td></td><td></td>'+DIMS.map(d=>{const v=m.idp_per_dim[d];return '<td class="'+(v>=0.10?'hot':'gold')+'">'+v.toFixed(3)+'</td>';}).join('')+'</tr>';
  }
  if(m.aaa){
    h+='<tr><td class="l">Scarto Devil</td><td></td><td></td>'+DIMS.map(d=>{const g=m.aaa.gap_per_dim[d];const t=m.aaa.targeted_objections.includes(d);return '<td class="'+(t?'hot':'dim')+'">'+Math.round(g*100)+'</td>';}).join('')+'</tr>';
  }
  return h+'</table>';
}

async function runScenario(sc){
  const b=box('pending','… '+sc.name);
  try{
    const t0=Date.now();
    const data=await post(EP_MIRAGE,buildP(sc.d,true));
    const ms=((Date.now()-t0)/1000).toFixed(1)+'s';
    const m=data.mirage;
    if(!m){b.className='box fail';b.innerHTML='✗ '+sc.name+' — blocco MIRAGE assente';return;}
    const withDims=data.results.slice(0,4).filter(r=>r.dimensioni&&!r._fallback).length;
    const miss=(m.agents_missing||[]).map(i=>NAMES[i]);
    const avgON=Math.round(data.results.reduce((s,r)=>s+(r.scoreON||0),0)/data.results.length);
    const avgSS=Math.round(data.results.reduce((s,r)=>s+(r.scoreSS||0),0)/data.results.length);
    b.className='box ok';
    b.innerHTML='<b>✓ '+sc.name+'</b> — '+ms+
      ' · media ON <span class="gold">'+avgON+'</span> · SS <span class="gold">'+avgSS+'</span>'+
      ' · agenti che hanno risposto '+withDims+'/4'+
      (miss.length?'<br><span class="hot">⚠ Non ha risposto: '+miss.join(', ')+' — escluso dai calcoli, il panel è incompleto</span>':'')+
      Object.entries(data.agent_errors||{}).map(([i,errs])=>{
        const ok=!(m.agents_missing||[]).includes(+i);
        return '<br><span class="'+(ok?'gold':'hot')+'">'+(ok?'↻ ':'✗ ')+NAMES[i]+(ok?' ha risposto dopo ':' ha fallito ')+errs.length+' errore/i:</span> <span class="dim">'+errs.map(e=>e.replace(/</g,'&lt;')).join(' · ')+'</span>';
      }).join('')+
      '<br>IDP_tot <span class="gold">'+m.idp_tot.toFixed(3)+'</span> · conflitti: '+
      (m.conflict_dimensions.length?'<span class="hot">'+m.conflict_dimensions.join(', ')+'</span>':'<span class="dim">nessuno</span>')+
      ' <span class="dim">(tra agenti di merito · con Devil '+(m.idp_tot_with_aaa!=null?m.idp_tot_with_aaa.toFixed(3):'—')+')</span>'+
      (m.aaa?'<br>Devil\'s Advocate · scarto medio <span class="gold">'+Math.round(m.aaa.gap_mean*100)+'</span> pt · obiezione mirata: '+
        (m.aaa.targeted_objections.length?'<span class="hot">'+m.aaa.targeted_objections.join(', ')+'</span>':'<span class="dim">nessuna</span>')+
        ' · C_AAA <span class="gold">'+m.aaa.c_aaa.toFixed(3)+'</span>':'')+
      mirageTable(m,data.results);
  }catch(e){b.className='box fail';b.innerHTML='✗ '+sc.name+' — '+e.message;}
}

async function runAll(){
  section('MIRAGE — 3 SCENARI');
  for(let i=0;i<SCENARIOS.length;i++){
    await runScenario(SCENARIOS[i]);
    if(i<SCENARIOS.length-1)await sleep(2000);
  }
}

async function runCompare(){
  section('CONFRONTO — stesso scenario, due endpoint');
  for(let i=0;i<SCENARIOS.length;i++){
    const sc=SCENARIOS[i];
    const b=box('pending','… '+sc.name);
    try{
      const prod=await post(EP_PROD,buildP(sc.d,false));
      await sleep(2000);
      const mir=await post(EP_MIRAGE,buildP(sc.d,true));
      let h='<b>'+sc.name+'</b><table><tr><th>Agente</th><th>Prod ON</th><th>Prod SS</th><th>MIRAGE ON</th><th>MIRAGE SS</th><th>Δ medio</th></tr>';
      prod.results.forEach((r,j)=>{
        const m=mir.results[j]||{};
        const d=Math.round(((m.scoreON||0)-(r.scoreON||0)+(m.scoreSS||0)-(r.scoreSS||0))/2);
        h+='<tr><td class="l">'+NAMES[j]+'</td><td>'+r.scoreON+'</td><td>'+r.scoreSS+'</td><td>'+m.scoreON+'</td><td>'+m.scoreSS+'</td><td class="'+(Math.abs(d)>=15?'hot':'dim')+'">'+(d>0?'+':'')+d+'</td></tr>';
      });
      h+='</table>';
      b.className='box ok';b.innerHTML=h;
    }catch(e){b.className='box fail';b.innerHTML='✗ '+sc.name+' — '+e.message;}
    if(i<SCENARIOS.length-1)await sleep(2000);
  }
  box('','<span class="dim">Δ medio = differenza tra MIRAGE e produzione. Valori piccoli (sotto 15) = il campo dimensioni non altera i voti. Valori grandi in rosso = la modifica MIRAGE sta cambiando il giudizio degli agenti.</span>');
}

/* ── FASE 2: Claude, GPT e Grok indipendenti sullo stesso panel + IDCM ── */
const MODEL_LABEL={claude:'Claude',gpt:'GPT-4o',grok:'Grok'};
async function runPhase2(){
  section('FASE 2 — TRE MODELLI INDIPENDENTI · IDCM');
  for(let i=0;i<SCENARIOS.length;i++){
    const sc=SCENARIOS[i];
    const b=box('pending','… '+sc.name+' (Claude, GPT e Grok in parallelo, circa un minuto)');
    try{
      const t0=Date.now();
      const res=await fetch(EP_MIRAGE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ai:'mirage',prompts:buildP(sc.d,true)})});
      const txt=await res.text(); let data; try{data=JSON.parse(txt);}catch(e){throw new Error('HTTP '+res.status+' — '+txt.substring(0,150));}
      if(!data.idcm)throw new Error('risposta senza blocco IDCM — '+txt.substring(0,150));
      const ms=((Date.now()-t0)/1000).toFixed(1)+'s';
      const x=data.idcm;
      const stCls=x.state==='stabile'?'gold':'hot';
      let h='<b>✓ '+sc.name+'</b> — '+ms+
        '<br>IDCM <span class="gold">'+(x.idcm!=null?x.idcm.toFixed(3):'—')+'</span> · stato <span class="'+stCls+'">'+x.state+'</span>'+
        ' · modelli validi '+(x.models_used||0)+'/3 · soglie '+x.threshold_profile.warn+' / '+x.threshold_profile.critical+
        '<br>Conflitti tra modelli: '+((x.conflict_dimensions||[]).length?'<span class="hot">'+x.conflict_dimensions.join(', ')+'</span>':'<span class="dim">nessuno</span>')+
        (x.most_divergent_model?' · modello più distante: <span class="gold">'+MODEL_LABEL[x.most_divergent_model]+'</span>':'')+
        (x.independence&&!x.independence.ok?'<br><span class="hot">⚠ Indipendenza: '+x.independence.issues.join('; ')+'</span>':'')+
        (x.prompt_template_hash?'<br><span class="dim">Istruzioni identiche per i 3 modelli · hash '+x.prompt_template_hash.slice(0,16)+'…</span>':'');
      // errori per fornitore
      Object.entries(data.errors||{}).forEach(([prov,byAgent])=>{
        Object.entries(byAgent||{}).forEach(([ai,errs])=>{
          const failed=(data.panels[prov].mirage.agents_missing||[]).includes(+ai);
          h+='<br><span class="'+(failed?'hot':'gold')+'">'+(failed?'✗ ':'↻ ')+MODEL_LABEL[prov]+' '+NAMES[ai]+(failed?' ha fallito ':' ha risposto dopo ')+errs.length+' errore/i:</span> <span class="dim">'+errs.map(e=>e.replace(/</g,'&lt;')).join(' · ')+'</span>';
        });
      });
      // tabella vettori per modello (media degli agenti di merito)
      h+='<table><tr><th>Modello</th><th>agenti</th>'+DIMS.map(d=>'<th>'+d.slice(0,5)+'</th>').join('')+'<th>distanza</th></tr>';
      x.models.forEach(m=>{
        if(!m.vector){h+='<tr><td class="l hot">'+MODEL_LABEL[m.name]+'</td><td colspan="8" class="hot">risposte insufficienti — escluso</td></tr>';return;}
        const d=(x.model_distances||{})[m.name];
        h+='<tr><td class="l">'+MODEL_LABEL[m.name]+'</td><td>'+m.merit_agents+'/3</td>'+m.vector.map(v=>'<td>'+Math.round(v*100)+'</td>').join('')+'<td class="gold">'+(d!=null?d.toFixed(3):'—')+'</td></tr>';
      });
      if(x.dim_divergence) h+='<tr><td class="l gold">Divergenza</td><td></td>'+DIMS.map(d=>{const v=x.dim_divergence[d];return '<td class="'+(v>=x.threshold_profile.warn?'hot':'gold')+'">'+v.toFixed(3)+'</td>';}).join('')+'<td></td></tr>';
      h+='</table>';
      // obiezione mirata del Devil per ciascun modello
      h+='<span class="dim">Devil\'s Advocate per modello: '+['claude','gpt','grok'].map(k=>{const a=data.panels[k].mirage.aaa;return MODEL_LABEL[k]+' → '+(a?(a.targeted_objections.join(', ')||'nessuna obiezione mirata'):'n/d');}).join(' · ')+'</span>';
      b.className='box ok'; b.innerHTML=h;
    }catch(e){b.className='box fail';b.innerHTML='✗ '+sc.name+' — '+e.message;}
    if(i<SCENARIOS.length-1)await sleep(3000);
  }
  box('','<span class="dim">Ogni riga è la media dei 3 agenti di merito di quel modello (Devil escluso). IDCM = distanza media dei modelli dal loro centro, divisa per √6. Sotto 0,10 i modelli concordano; tra 0,10 e 0,20 divergenza moderata; da 0,20 incertezza critica. Una dimensione in rosso è un disaccordo localizzato anche quando l\'IDCM complessivo è basso.</span>');
}
</script>
</body>
</html>
